name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.29.3"
  WAILS_VERSION: "v2.12.0"

jobs:
  verify-and-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-24.04
            artifact: tailorcv-linux-amd64
            go_args: -tags=webkit2_41
            build_args: -tags=webkit2_41
          - name: macOS arm64
            os: macos-15
            artifact: tailorcv-macos-arm64
            go_args: ""
            build_args: ""
          - name: Windows amd64
            os: windows-2025
            artifact: tailorcv-windows-amd64
            go_args: ""
            build_args: -webview2=browser

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run Go tests and migrations
        run: go test ${{ matrix.go_args }} ./...

      - name: Run Go vet
        run: go vet ${{ matrix.go_args }} ./...

      - name: Run frontend tests
        run: pnpm --dir frontend test

      - name: Type-check and build frontend
        run: pnpm --dir frontend build

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build packaged application
        run: wails build -clean -m -trimpath ${{ matrix.build_args }}

      - name: Upload smoke-build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/**
          if-no-files-found: error
          retention-days: 7
