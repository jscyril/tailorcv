name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.29.3"
  WAILS_VERSION: "v2.12.0"

jobs:
  verify-and-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-24.04
            artifact: tailorcv-linux-amd64
            target_os: linux
            target_arch: amd64
            runtime_dir: build/bin/bin
            tectonic_name: tectonic
            app_executable: ./build/bin/tailorcv
            go_args: -tags=webkit2_41
            build_args: -tags=webkit2_41
          - name: macOS arm64
            os: macos-15
            artifact: tailorcv-macos-arm64
            target_os: darwin
            target_arch: arm64
            runtime_dir: build/bin/TailorCV.app/Contents/MacOS/bin
            tectonic_name: tectonic
            app_executable: ./build/bin/TailorCV.app/Contents/MacOS/tailorcv
            go_args: ""
            build_args: ""
          - name: Windows amd64
            os: windows-2025
            artifact: tailorcv-windows-amd64
            target_os: windows
            target_arch: amd64
            runtime_dir: build/bin/bin
            tectonic_name: tectonic.exe
            app_executable: ./build/bin/tailorcv.exe
            go_args: ""
            build_args: -webview2=browser

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run Go tests and migrations
        run: go test ${{ matrix.go_args }} ./...

      - name: Run Go vet
        run: go vet ${{ matrix.go_args }} ./...

      - name: Run frontend tests
        run: pnpm --dir frontend test

      - name: Type-check and build frontend
        run: pnpm --dir frontend build

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build packaged application
        run: wails build -clean -m -trimpath ${{ matrix.build_args }}

      - name: Package pinned offline Tectonic runtime
        run: go run ./cmd/packagetectonic -goos ${{ matrix.target_os }} -goarch ${{ matrix.target_arch }} -destination ${{ matrix.runtime_dir }}

      - name: Restore macOS ad-hoc application signature
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - build/bin/TailorCV.app
          codesign --verify --deep --strict build/bin/TailorCV.app

      - name: Verify packaged Tectonic integration offline
        env:
          TAILORCV_TECTONIC: ${{ github.workspace }}/${{ matrix.runtime_dir }}/${{ matrix.tectonic_name }}
          TAILORCV_TECTONIC_BUNDLE: ${{ github.workspace }}/${{ matrix.runtime_dir }}/tectonic-resources.zip
          TAILORCV_TECTONIC_INTEGRATION: "1"
        run: go test ${{ matrix.go_args }} -count=1 -run TestCompilerIntegration ./internal/resume

      - name: Verify packaged application workflow
        run: ${{ matrix.app_executable }} --verify-packaged-workflow

      - name: Verify native credential lifecycle
        if: runner.os != 'Linux'
        run: ${{ matrix.app_executable }} --verify-native-credentials

      - name: Verify Linux Secret Service credential lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          verification_root="$(mktemp -d "${RUNNER_TEMP}/tailorcv-keyring-XXXXXX")"
          mkdir -p "${verification_root}/data" "${verification_root}/runtime"
          chmod 700 "${verification_root}/runtime"
          XDG_DATA_HOME="${verification_root}/data" XDG_RUNTIME_DIR="${verification_root}/runtime" dbus-run-session -- bash -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            ./build/bin/tailorcv --verify-native-credentials
          '

      - name: Upload packaged build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/**
          if-no-files-found: error
          retention-days: 7
